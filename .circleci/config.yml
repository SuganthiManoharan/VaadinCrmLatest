version: '2.1'
orbs:
    docker: circleci/docker@2.2.0
jobs:
    build:
        docker:
            - image: maven:3.8.1-openjdk-17-slim
        environment:
          MAVEN_CLI_OPTS: "--batch-mode"
        steps:
            - checkout
            - run: mvn $MAVEN_CLI_OPTS -Dvaadin.offlineKey="pro-6e6ed525-d743-4243-a6db-427a4220f6c8" clean package -Pproduction -e
            - store_artifacts:
                path: target
                destination: target                
    test:
        docker:
            - image: maven:3.8.1-openjdk-17-slim
        steps:
            - checkout
            - run: mvn test -e
            - store_artifacts:
                  path: reports
                  destination: reports

    build-docker-image:
        docker:
            - image: cimg/azure:2025.01
        steps:
            - checkout
            - docker/install-docker-tools
            - setup_remote_docker:
                  docker_layer_caching: true
            - run:
                  name: Build and push Docker image
                  command: |
                      docker build -t vaadincrm.azurecr.io/vaadincrm:latest .
                      echo $DOCKER_PASS | docker login vaadincrm.azurecr.io -u $DOCKER_USER --password-stdin
                      docker push vaadincrm.azurecr.io/vaadincrm:latest
workflows:
    build-test-and-deploy:
        jobs:
            - build
            - test
            - build-docker-image

